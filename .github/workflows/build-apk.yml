name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular versión automática
        id: version
        run: |
          COUNT=$(git rev-list --count HEAD)
          MAJOR=$((COUNT / 1000))
          MINOR=$(( (COUNT / 100) % 10 ))
          PATCH=$(( COUNT % 100 ))
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          echo "code=$COUNT" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VersionCode: $COUNT"
          echo "VersionName: $VERSION_NAME"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Decodificar keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/gtv-release.jks
          ls -lh ${{ github.workspace }}/gtv-release.jks

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/gtv-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_VERSION_CODE: ${{ steps.version.outputs.code }}
          BUILD_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: gtv-play-apk-v${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/release/*.apk
