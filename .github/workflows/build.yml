name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Bump Version
        id: bump
        run: |
          # Obtenemos el último tag de release (formato vX.Y)
          LAST_TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/abrel1990/gtv-play-r/releases/latest \
            | grep -oP '"tag_name":\s*"v\K[0-9.]+')

          if [ -z "$LAST_TAG" ]; then
            # No hay release previo: arrancamos en 10
            NEW_CODE=10
            NEW_NAME="0.10"
          else
            # Tomamos la parte decimal del tag (ej: 0.10 -> 10)
            MINOR=$(echo "$LAST_TAG" | cut -d'.' -f2)
            if [ -z "$MINOR" ]; then
              MINOR=10
            fi
            # Sumamos 1 en base 10 (nunca octal)
            NEW_CODE=$((10#$MINOR + 1))
            NEW_NAME="0.${NEW_CODE}"
          fi

          # Sanity check: el código debe ser un entero positivo
          if ! [[ "$NEW_CODE" =~ ^[0-9]+$ ]]; then
            echo "ERROR: NEW_CODE inválido ($NEW_CODE), usando 10 por defecto"
            NEW_CODE=10
            NEW_NAME="0.10"
          fi

          # Forzamos base 10 explícita para evitar interpretación octal
          NEW_CODE=$((10#$NEW_CODE))

          # Escribimos el versionCode y versionName en app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $NEW_CODE/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$NEW_NAME\"/" app/build.gradle

          # Verificamos que el sed haya funcionado
          echo "--- app/build.gradle (líneas de versión) ---"
          grep -E "versionCode|versionName" app/build.gradle || true

          echo "NEW_CODE=$NEW_CODE" >> $GITHUB_ENV
          echo "NEW_NAME=$NEW_NAME" >> $GITHUB_ENV
          echo "Generando versión: v$NEW_NAME (Code: $NEW_CODE)"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/gtv-play-r.jks
          echo "KEYSTORE_PATH=gtv-play-r.jks" >> $GITHUB_ENV

      - name: Build Release APK
        run: chmod +x gradlew && ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_NAME }}
          name: GTV Play R v${{ env.NEW_NAME }}
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
