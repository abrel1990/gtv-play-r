plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gtv.play.r'
    compileSdk 34

    defaultConfig {
        applicationId "com.gtv.play.r"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "gtv-play-r.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    // ExoPlayer (Media3)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    // YouTubePlayerView (Soffritti)
    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:core:13.0.0'

    // LibVLC (fallback IPTV problemático)
    implementation 'org.videolan.android:libvlc-all:3.6.0'

    // Glide (logos)
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // AppCompat
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // WatchNext (Android TV)
    implementation 'androidx.tvprovider:tvprovider:1.1.0'
}
