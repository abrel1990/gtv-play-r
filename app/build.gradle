plugins {
    id 'com.android.application'
}

// Lee el versionCode que le pasa el workflow de GitHub Actions.
// Si no viene (compilación local), usa 1 como fallback.
def buildVersionCode = (System.getenv("BUILD_VERSION_CODE") ?: "1").toInteger()
def buildVersionName = System.getenv("BUILD_VERSION_NAME") ?: "1.0.${buildVersionCode}"

android {
    namespace 'com.gtv.play'
    compileSdk 34

    defaultConfig {
        applicationId "com.gtv.play"
        minSdk 21
        targetSdk 34
        versionCode buildVersionCode
        versionName buildVersionName
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "gtv-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: "gtv-release"
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
