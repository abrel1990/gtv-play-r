plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gtv.play.r'
    compileSdk 34

    defaultConfig {
        applicationId "com.gtv.play.r"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // ExoPlayer (Media3) - motor principal para IPTV
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    // YouTubePlayerView (Soffritti) - YouTube nativo
    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:core:13.0.0'

    // LibVLC OFICIAL de VideoLAN - fallback
    implementation 'org.videolan.android:libvlc-all:3.6.0'

    // Glide (logos)
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // AppCompat
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // TV Provider (WatchNext)
    implementation "androidx.tvprovider:tvprovider:1.1.0"

    // NewPipe Extractor (YouTube)
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.0'

    // Desugaring para NewPipe (minSdk 21 < 33)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.4'
}
