plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gtv.play.r'
    compileSdk 36

    defaultConfig {
        applicationId "com.gtv.play.r"
        minSdk 23        // ✅ Cambiado de 21 a 23 para GSYVideoPlayer
        targetSdk 34
        versionCode 10
        versionName "0.10"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "gtv-play-r.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:core:13.0.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.tvprovider:tvprovider:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ✅ GSYVideoPlayer con IJK/FFmpeg (reemplaza a VLC)
    // El módulo 'ex_so' es el que incluye el soporte para MPEG-2
    implementation 'io.github.carguo:gsyvideoplayer:14.1.0'
    implementation 'io.github.carguo:gsyvideoplayer-ex_so:14.1.0'
}
