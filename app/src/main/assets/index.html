<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden;position:fixed;top:0;left:0;right:0;bottom:0;-webkit-user-select:none;user-select:none}

.hidden{display:none!important}
button{font-family:inherit}
.status-bar{position:fixed;top:0;left:0;right:0;height:48px;padding:0 12px;display:flex;justify-content:space-between;align-items:center;z-index:100;font-size:12px;background:#0b0b0b;border-bottom:2px solid #FFD700;cursor:pointer}

.status-bar.ocultar{display:none}
.status-left{display:flex;align-items:center;gap:8px}

.status-text{font-weight:bold}

.status-time{font-family:monospace;font-size:11px;background:rgba(255,255,255,.08);padding:4px 8px;border-radius:20px}

.empty button:focus{outline:3px solid #fff;background:#e6c200;transform:scale(1.05)}

.empty small{color:#666;margin-top:20px;font-size:11px}
.view-play{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;display:none;z-index:1000}

.wrapper{position:absolute;top:0;left:0;width:100%;height:100%;background:#000}

.ui{position:absolute;top:0;left:0;right:0;bottom:0;z-index:20;pointer-events:none;opacity:0}

.nav-btn{position:absolute;top:50%;margin-top:-40px;width:60px;height:80px;background:rgba(0,0,0,.6);color:#FFD700;border:2px solid #FFD700;border-radius:10px;font-size:34px;cursor:pointer;pointer-events:auto}

.nav-btn:active,.float-btn:active{background:#FFD700;color:#000}

.float-btn{position:absolute;right:15px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.7);color:#FFD700;border:2px solid #FFD700;font-size:22px;cursor:pointer;pointer-events:auto}

.modal-name{font-size:13px;font-weight:bold;color:#FFD700;overflow:hidden;text-overflow:ellipsis}

.loader{position:absolute;top:50%;left:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);background:rgba(0,0,0,.9);padding:10px 20px;border-radius:30px;border:2px solid #FFD700;color:#FFD700;font-weight:bold;display:none;z-index:30;white-space:nowrap;font-size:14px}

.sin-senal{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:35;text-align:center;padding:24px;pointer-events:none}

.sin-senal img{max-height:80px;max-width:220px;margin-bottom:22px;object-fit:contain;opacity:.95}
.sin-senal .ss-nombre{font-size:24px;font-weight:bold;color:#FFD700;margin-bottom:14px;letter-spacing:.5px;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.info-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.96);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}

.whatsapp-number-tv .label{color:#25D366;font-size:11px;font-weight:bold;letter-spacing:1px;margin-bottom:6px}
.whatsapp-number-tv .number{color:#fff;font-size:22px;font-weight:bold;font-family:monospace;letter-spacing:2px}
.button-group{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
.info-container button,.popup-box button,.toast-blocked button{background:#FFD700;color:#000;border:none;padding:12px 20px;border-radius:40px;font-weight:bold;font-size:14px;cursor:pointer;min-width:100px}

.whatsapp-btn{background:#25D366!important;color:#fff!important}
.toast-blocked{position:fixed;bottom:90px;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:#000;border:2px solid #FFD700;border-radius:30px;padding:12px 20px;z-index:10001;display:flex;gap:12px;align-items:center;font-size:14px;white-space:nowrap}

.popup-box{background:#141414;border:3px solid #FFD700;border-radius:24px;padding:26px 30px;max-width:550px;width:90%;max-height:85vh;text-align:center}

.popup-box .ptext{color:#e0e0e0;font-size:16px;line-height:1.7;max-height:55vh;overflow-y:auto}
.popup-box button{margin-top:18px;padding:12px 40px}
.set-box{text-align:left;max-height:92vh;overflow-y:auto;width:90%;max-width:550px;font-size:15px}
.set-box h2{text-align:center;margin-bottom:18px}
.set-sec{font-size:14px;color:#FFD700;font-weight:bold;letter-spacing:1px;margin:18px 0 10px;text-transform:uppercase}
.set-row{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.set-input{flex:1;min-width:0;background:#000;color:#fff;border:2px solid #444;border-radius:10px;padding:12px 14px;font-size:15px}
.set-input:focus{border-color:#FFD700}
.set-empty{color:#888;font-size:14px;text-align:center;padding:12px 0}
.s-item{display:flex;align-items:center;gap:10px;background:#1f1f1f;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.s-info{flex:1;min-width:0}
.s-info b{display:block;font-size:15px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-info small{font-size:12px;color:#aaa}
.info-container .s-item button{min-width:0;padding:10px 16px;font-size:14px}
.info-container .s-del{background:#7a1010;color:#fff}
.info-container .s-del:focus{background:#c0392b}
.block-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;overflow-y:auto}
.block-screen .box{max-width:320px;width:100%}
.block-screen button{background:#25D366;color:#fff;border:none;padding:12px 20px;border-radius:50px;font-size:14px;font-weight:bold;cursor:pointer;margin:6px 0;width:100%;max-width:230px}
.block-screen button:focus{outline:3px solid #fff}
.block-screen button.alt{background:#FFD700;color:#000}
#movies{display:none;width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#0a0a0a}
#movies.active{display:block}
.peliculas-header{position:sticky;top:0;background:#050505;padding:0 20px;z-index:99;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(229,9,20,.4);height:56px}
.peliculas-logo{font-size:18px;font-weight:800;color:#fff;cursor:pointer;padding:6px 10px;border-radius:10px;border:2px solid transparent}
.peliculas-counter{background:linear-gradient(135deg,#f1c40f,#e67e22);padding:5px 14px;border-radius:40px;font-size:13px;font-weight:800;color:#000;cursor:pointer;border:2px solid transparent}
.peliculas-logo:focus,.peliculas-counter:focus{border-color:#FFD700;background-color:#2a1a1a}
.peliculas-counter:focus{background:#FFD700}
.hint{font-size:10px;color:#777;position:absolute;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);pointer-events:none}
#mcontent{padding:10px 0 30px}
.msg{text-align:center;padding:60px 20px;color:#FFD700}.msg.err{color:#E50914}
.peliculas-section{margin:14px 0 8px}
.section-header{padding:0 20px 8px}
.section-title{font-size:17px;font-weight:700;position:relative;display:inline-block;padding-bottom:6px}
.section-title:after{content:'';position:absolute;bottom:0;left:0;width:40px;height:3px;background:#E50914;border-radius:2px}
.slider-container{overflow-x:auto;padding:6px 20px 14px;scrollbar-width:none}
.slider-container::-webkit-scrollbar{display:none}
.cards-slider{display:flex;gap:10px}
.pelicula-card,.ver-todos-card{width:140px;flex-shrink:0;position:relative;border-radius:10px;overflow:hidden;cursor:pointer;background:#1a1a1a;border:2px solid transparent}
.pelicula-card:focus,.ver-todos-card:focus{border-color:#FFD700}
body:not(.lite) .pelicula-card,body:not(.lite) .ver-todos-card{transition:-webkit-transform .15s;transition:transform .15s}

.pelicula-card-img{position:relative;height:0;padding-bottom:150%;overflow:hidden;background:#111}
.pelicula-card-img img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.pelicula-card-img:after{content:'';position:absolute;bottom:0;left:0;right:0;height:55%;background:linear-gradient(to top,rgba(0,0,0,.95),transparent);pointer-events:none}
.pelicula-year-badge{position:absolute;top:8px;right:8px;background:#E50914;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;z-index:3}
.pelicula-type-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);padding:3px 8px;border-radius:20px;font-size:9px;z-index:3}
.pelicula-new-badge{position:absolute;top:34px;left:8px;background:#2ecc71;color:#000;font-size:8px;font-weight:800;padding:2px 8px;border-radius:20px;z-index:4}
.pelicula-card-info{position:absolute;bottom:0;left:0;right:0;padding:30px 10px 10px;z-index:3}
.pelicula-card-title{font-size:12px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pelicula-fav-btn{position:absolute;bottom:46px;left:8px;background:rgba(0,0,0,.6);color:#f1c40f;width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%;font-size:14px;z-index:5}
.pelicula-fav-btn.active{background:#e67e22;color:#fff}
.delete-history-btn{position:absolute;top:32px;right:8px;background:rgba(0,0,0,.7);width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;font-size:12px;z-index:5}
.ver-todos-card{background:#101020;border-color:#E50914;display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:210px}
.ver-todos-card .ico{font-size:32px;margin-bottom:6px}
.ver-todos-card .txt{font-size:12px;font-weight:700;color:#E50914}
.ver-todos-card .cnt{font-size:9px;color:#777;margin-top:4px}
#grid{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0a;z-index:2000;overflow-y:auto;display:none;padding:70px 15px 30px;-webkit-overflow-scrolling:touch}
#grid.active{display:block}
.grid-header{position:fixed;top:0;left:0;right:0;background:#050505;padding:0 20px;height:56px;display:flex;justify-content:space-between;align-items:center;z-index:2001;border-bottom:1px solid rgba(229,9,20,.4)}
.grid-header h3{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
.grid-close{background:#E50914;border:2px solid transparent;color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0}

#gcontent{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding:10px 0}
#gcontent .pelicula-card{width:auto}
@media (max-width:480px){#gcontent{grid-template-columns:repeat(2,1fr);gap:10px}.pelicula-card,.ver-todos-card{width:110px}.ver-todos-card{min-height:165px}.section-header,.slider-container{padding-left:12px;padding-right:12px}.status-bar{height:40px;font-size:11px}}
body.tv *{animation:none!important;transition:none!important}
body.lite .pelicula-card,body.lite .ver-todos-card{transition:none!important}
@keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="status-bar" id="statusBar" tabindex="0">

</div>

  for(var i=0;i<l.length;i++){var d=l[i].dataset;if(d.u===id||d.k===id||d.genre===id)return l[i]}
  return null;
}
function abrirPeliculas(url){
  S.fromMovies=false;
  setView('movies');
  var fresco=M.url===url&&M.items.length&&(Date.now()-M.at)<300000;
  if(M.items.length&&M.url===url){renderPelis();focoPelis();if(fresco)return}
  else D.mc.innerHTML='<div class="msg">⏳ Cargando títulos…</div>';
  M.url=url;
  fetchW(url+'?t='+Date.now(),15000).then(function(r){return r.text()}).then(function(t){
    parsePelis(t);M.at=Date.now();
    if(S.view==='movies'&&!S.grid){renderPelis();focoPelis()}
    else S.pelisDirty=true;
  }).catch(function(){if(!M.items.length)D.mc.innerHTML='<div class="msg err">❌ Error al cargar</div>'});
}
function salirPeliculas(){S.fromMovies=false;if(S.grid)cerrarGrid(true);setView('list');restaurarFoco()}
function toggleFav(u){
  var it=buscarItem(u);if(!it)return;
  var i=-1;
  for(var k=0;k<M.favs.length;k++)if(M.favs[k].url===u){i=k;break}
  if(i<0)M.favs.unshift(slim(it));else M.favs.splice(i,1);
  ls.setJ('peliculasFavoritos',M.favs);
  S.pelisDirty=true;
}
function quitarHist(u){M.hist=M.hist.filter(function(v){return v.url!==u});ls.setJ('peliculasHistory',M.hist);S.pelisDirty=true}
function addHist(it){M.hist=M.hist.filter(function(v){return v.url!==it.url});M.hist.unshift(slim(it));if(M.hist.length>20)M.hist.length=20;ls.setJ('peliculasHistory',M.hist);S.pelisDirty=true}
function longPress(card){
  if(card.dataset.k||card.classList.contains('ver-todos-card'))return;
  var u=card.dataset.u;
  if(card.closest('[data-sec="hist"]'))quitarHist(u);else toggleFav(u);
}
function reproPeli(it){
  var now=Date.now();
  if(S.native||S.dlg||now-S.exitAt<BLOQUEO_MS)return;
  if(S.lastU===it.url&&now-S.lastAt<1200)return;
  S.lastU=it.url;S.lastAt=now;S.lastMovieUrl=it.url;
  addHist(it);
  S.fromMovies=true;
  lanzar({nombre:it.title,logo:it.logo,url:it.url},0,1);
}
function activarCard(card){
  if(!card)return;
  if(card.classList.contains('ver-todos-card')){abrirGenero(card.dataset.genre);return}
  if(card.dataset.k){var t=M.series.get(card.dataset.k);if(t)openGrid('📺 '+t.serieNombre+' - Temporada '+t.temporada,t.caps,true);return}
  var it=buscarItem(card.dataset.u);
  if(it)reproPeli(it);
}
function clickPelis(e){
  if(Date.now()-S.suppressClick<700)return;
  var card=e.target.closest?e.target.closest('.pelicula-card,.ver-todos-card'):null;
  if(!card)return;
  var act=e.target.closest('[data-act]');
  if(act){
    var a=act.dataset.act;
    if(a==='fav')toggleFav(card.dataset.u);
    else if(a==='del')quitarHist(card.dataset.u);
    return;
  }
  activarCard(card);
}
function bindPress(el){
  var t=null;
  var clear=function(){clearTimeout(t);t=null};
  var start=function(e){
    var c=e.target.closest?e.target.closest('.pelicula-card'):null;
    if(!c||e.target.closest('[data-act]'))return;
    clear();
    t=setTimeout(function(){t=null;S.suppressClick=Date.now();longPress(c)},800);
  };
  el.addEventListener('touchstart',start,{passive:true});
  el.addEventListener('mousedown',start);
  ['touchend','touchmove','touchcancel','mouseup','mouseleave'].forEach(function(n){el.addEventListener(n,clear,{passive:true})});
  el.addEventListener('contextmenu',function(e){e.preventDefault()});
}
function openGrid(titulo,list,caps){
  G.list=list;G.n=0;G.caps=!!caps;
  D.gt.textContent=titulo;
  D.gc.innerHTML='';
  D.grid.scrollTop=0;
  S.gridOpener=document.activeElement;
  S.grid=true;
  D.grid.classList.add('active');
  masGrid();
  setTimeout(function(){var c=D.gc.firstElementChild;if(c)c.focus();else $('gclose').focus()},40);
}
function masGrid(){
  if(G.n>=G.list.length)return;
  var end=Math.min(G.n+60,G.list.length),h='';
  for(var i=G.n;i<end;i++)h+=cardHtml(G.list[i],{cap:G.caps});
  G.n=end;
  D.gc.insertAdjacentHTML('beforeend',h);
}
function cerrarGrid(silencioso){
  S.grid=false;
  D.grid.classList.remove('active');
  if(silencioso)return;
  if(S.pelisDirty){renderPelisKeep();return}
  var o=S.gridOpener;
  if(o&&document.body.contains(o))o.focus();else focoPelis();
}
function renderPelisKeep(){
  var a=document.activeElement,id=a&&a.dataset?(a.dataset.u||a.dataset.k||a.dataset.genre):null,st=D.movies.scrollTop;
  renderPelis();
  D.movies.scrollTop=st;
  var c=buscarCard(D.mc,id);
  if(c){try{c.focus({preventScroll:true})}catch(e){c.focus()}}
  else focoPelis();
}
function abrirGenero(nombre){
  var g=null;
  for(var i=0;i<M.genres.length;i++)if(M.genres[i].name===nombre){g=M.genres[i];break}
  if(g)openGrid('📺 '+nombre.toUpperCase(),ordenar(g.tiles),false);
}
function abrirTodos(){if(M.items.length)openGrid('📺 TODOS LOS TÍTULOS',ordenar(M.tiles),false)}
function keyName(e){
  switch(e.key){
    case 'Enter':case 'OK':case 'Select':case 'Accept':return 'ok';
    case 'Escape':case 'Backspace':case 'GoBack':case 'BrowserBack':return 'back';
    case 'ArrowUp':return 'up';
    case 'ArrowDown':return 'down';
    case 'ArrowLeft':return 'left';
    case 'ArrowRight':return 'right';
    case 'ChannelUp':return 'chup';
    case 'ChannelDown':return 'chdn';
  }
  switch(e.keyCode){
    case 13:case 23:case 66:return 'ok';
    case 4:case 8:case 27:return 'back';
    case 38:return 'up';case 40:return 'down';case 37:return 'left';case 39:return 'right';
    case 427:return 'chup';case 428:return 'chdn';
  }
  return null;
}
function atras(){
  var now=Date.now();
  if(now-S.backAt<250)return;
  S.backAt=now;
  if(S.dlg){cerrarDialogo();return}
  if(S.grid){cerrarGrid();return}
  if(S.view==='player'){detener();return}
  if(S.view==='movies'){salirPeliculas();return}
  try{if(hasNat('salirApp')){nat('salirApp');return}}catch(e){}
  try{window.close()}catch(e){}
}
function navDialog(k,e){
  var a=document.activeElement,enInput=a&&a.tagName==='INPUT';
  if(enInput&&(k==='left'||k==='right'||k==='ok'))return;
  e.preventDefault();
  var bs=dlgBtns();
  if(!bs.length)return;
  var i=bs.indexOf(a);
  if(k==='right'||k==='down')bs[(i+1)%bs.length].focus();
  else if(k==='left'||k==='up')bs[(i-1+bs.length)%bs.length].focus();
  else if(k==='ok'&&!e.repeat)(i>=0?bs[i]:bs[0]).click();
}
function okDown(card){S.okDown=card;S.okFired=false;clearTimeout(S.okTimer);S.okTimer=setTimeout(function(){S.okFired=true;longPress(card)},800)}
function navGrid(k,e){
  var a=document.activeElement,close=$('gclose');
  if(a===close){
    if(k==='ok'){e.preventDefault();if(!e.repeat)cerrarGrid()}
    else if(k==='down'){e.preventDefault();var f=D.gc.firstElementChild;if(f)f.focus()}
    return;
  }
  var cards=D.gc.children,i=Array.prototype.indexOf.call(cards,a);
  e.preventDefault();
  if(i<0){var c0=cards[0];if(c0)c0.focus();else close.focus();return}
  if(k==='ok'){if(!e.repeat)okDown(a);return}
  var cols=colsDe(D.gc),n=i;
  if(k==='right')n=i+1;
  else if(k==='left')n=i-1;
  else if(k==='down')n=i+cols;
  else if(k==='up'){if(i<cols){close.focus();return}n=i-cols}
  else return;
  if(n>=cards.length&&G.n<G.list.length)masGrid();
  if(n>=cards.length)n=cards.length-1;
  if(n>=0&&n!==i)cards[n].focus();
}
function colsDe(el){
  var c=el.children;if(!c.length)return 4;
  var t=c[0].offsetTop,n=1;
  while(n<c.length&&c[n].offsetTop===t)n++;
  return n;
}
function navPelis(k,e){
  var a=document.activeElement,hdr=[$('mback'),$('mcount')],hi=hdr.indexOf(a);
  e.preventDefault();
  if(hi>=0){
    if(k==='right'&&hi<1)hdr[1].focus();
    else if(k==='left'&&hi>0)hdr[0].focus();
    else if(k==='down'){var c=D.mc.querySelector('.pelicula-card,.ver-todos-card');if(c)c.focus()}
    else if(k==='ok'&&!e.repeat){if(hi===0)salirPeliculas();else abrirTodos()}
    return;
  }
  var card=a&&a.closest?a.closest('.pelicula-card,.ver-todos-card'):null;
  if(!card){var f=D.mc.querySelector('.pelicula-card,.ver-todos-card');if(f)f.focus();else hdr[0].focus();return}
  if(k==='ok'){if(!e.repeat)okDown(card);return}
  var row=card.parentNode,cards=row.children,i=Array.prototype.indexOf.call(cards,card);
  if(k==='right'){if(cards[i+1])cards[i+1].focus()}
  else if(k==='left'){if(cards[i-1])cards[i-1].focus()}
  else if(k==='down'||k==='up'){
    var sec=row.parentNode.parentNode,s=k==='down'?sec.nextElementSibling:sec.previousElementSibling;
    if(!s){if(k==='up')hdr[0].focus();return}
    var r2=s.querySelector('.cards-slider'),x=card.getBoundingClientRect().left,best=r2.children[0],bd=1e9;
    for(var j=0;j<r2.children.length;j++){var d=Math.abs(r2.children[j].getBoundingClientRect().left-x);if(d<bd){bd=d;best=r2.children[j]}}
    if(best)best.focus();
  }
}
function navLista(k,e){
  var a=document.activeElement;
  if(a===D.btnMenu){
    if(k==='left'){e.preventDefault();D.bar.focus()}
    else if(k==='down'){e.preventDefault();focusCard(S.index)}
    else if(k==='ok'){e.preventDefault();if(!e.repeat)abrirSettings()}
    return;
  }
  if(a===D.bar){
    if(k==='down'){e.preventDefault();focusCard(S.index)}
    else if(k==='right'){e.preventDefault();D.btnMenu.focus()}
    else if(k==='ok'){e.preventDefault();if(!e.repeat)infoDialog()}
    return;
  }
  var ab=$('btnAddList');
  if(ab&&a===ab){
    if(k==='up'){e.preventDefault();D.btnMenu.focus()}
    else if(k==='ok'){e.preventDefault();if(!e.repeat)abrirSettings()}
    return;
  }
  var idx=(a&&a.classList&&a.classList.contains('card'))?parseInt(a.dataset.i,10):-1;
  if(idx<0){
    if(k==='ok'||k==='up'||k==='down'||k==='left'||k==='right'){
      e.preventDefault();
      if(ab)ab.focus();else focusCard(S.index);
    }
    return;
  }
  if(k==='ok'){e.preventDefault();if(!e.repeat)play(idx,'user');return}
  var vis=canalesVisibles(),len=vis.length,posVis=-1;
  for(var q=0;q<len;q++)if(vis[q]===idx){posVis=q;break}
  if(posVis<0){e.preventDefault();focusCard(S.index);return}
  var cols=colsDe(D.list),n=posVis;
  if(k==='down'){n=posVis+cols;if(n>=len&&Math.floor(posVis/cols)<Math.floor((len-1)/cols))n=len-1}
  else if(k==='up'){if(posVis<cols){e.preventDefault();D.bar.focus();return}n=posVis-cols}
  else if(k==='left')n=posVis-1;
  else if(k==='right')n=posVis+1;
  else return;
  e.preventDefault();
  if(n>=0&&n<len&&n!==posVis){S.index=vis[n];focusCard(vis[n])}
}
var navBusy=false;
function frenar(e){if(e.repeat&&navBusy){e.preventDefault();return true}navBusy=true;(window.requestAnimationFrame||setTimeout)(function(){navBusy=false});return false}
document.addEventListener('keydown',function(e){
  if(S.locked)return;
  var k=keyName(e);
  if(!k)return;
  if(k==='back'){
    if(e.target&&e.target.tagName==='INPUT'&&(e.key==='Backspace'||e.keyCode===8))return;
    e.preventDefault();e.stopPropagation();atras();return;
  }
  if(S.dlg){navDialog(k,e);return}
  if(k!=='ok'&&(S.grid||S.view==='movies'||S.view==='list')&&frenar(e))return;
  if(S.grid){navGrid(k,e);return}
  if(S.view==='player'){e.preventDefault();showUI();if(k==='right'||k==='chup')zap(1);else if(k==='left'||k==='chdn')zap(-1);return}
  if(S.view==='movies'){navPelis(k,e);return}
  navLista(k,e);
});
document.addEventListener('keyup',function(e){
  if(S.locked||!S.okDown||keyName(e)!=='ok')return;
  e.preventDefault();
  clearTimeout(S.okTimer);
  var c=S.okDown;
  S.okDown=null;
  if(S.okFired){S.okFired=false;return}
  activarCard(c);
});

function cargarListaInicial(){
  D.list.innerHTML = '<div class="empty" id="loadingState">' +
    '<div class="icon" style="animation: spin 1s linear infinite">⚙️</div>' +
    '<div class="title">Conectando con el servidor...</div>' +
    '<div class="subtitle">Verificando licencia y actualizando lista de canales.</div>' +
    '</div>';
  setTimeout(function() {
    if (S.list.length === 0 && !S.native && !document.getElementById('loadingState')) {
      return;
    }
    if (S.list.length === 0 && !S.native) {
      var el = document.getElementById('loadingState');
      if (el) renderLista();
    }
  }, 12000);
}

function iniciarApp(){
  try{registrarDispositivo();verificarBaneo()}catch(e){}
  fetchW(BAN_URL+'/api/fecha?device='+encodeURIComponent(deviceId),8000).then(function(r){return r.json()}).then(function(d){
    if(d&&d.primeraVez){lic.demoStart=new Date(d.primeraVez).getTime();remote.demoSrv=true;guardarLic();actualizarBarra()}
  }).catch(noop);
  aplicarCacheEstado();
  sincronizarEstadoCanales();
  setInterval(actualizarBarra, 30000);
  setInterval(function(){
    if(document.hidden || S.native) return;
    fetchW(CONFIG_URL + '?t=' + Date.now(), 10000)
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){ if(d){ aplicarConfig(d); actualizarBarra(); } })
      .catch(noop);
  }, 60000);
  setInterval(function(){if(!document.hidden||enExoNat())pubSchedulerTick()},1500);
  setTimeout(pubSchedulerTick,2000);
  setInterval(function(){if(!S.native&&!document.hidden)sincronizarEstadoCanales()},3*60*1000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&!S.native)sincronizarEstadoCanales();if(!document.hidden)setTimeout(pubSchedulerTick,500)});
  setTimeout(cargarListaMaestraDesdeHTML, 3000);
}
D.list.addEventListener('click',function(e){
  var c=e.target.closest?e.target.closest('.card'):null;
  if(c)play(parseInt(c.dataset.i,10),'user');
});
D.bar.addEventListener('click',function(){infoDialog()});
D.btnMenu.addEventListener('click',function(e){e.stopPropagation();abrirSettings()});
D.mc.addEventListener('click',clickPelis);
D.gc.addEventListener('click',clickPelis);
bindPress(D.mc);
bindPress(D.gc);
$('mback').addEventListener('click',salirPeliculas);
$('mcount').addEventListener('click',abrirTodos);
$('gclose').addEventListener('click',function(){cerrarGrid()});
D.grid.addEventListener('scroll',function(){if(D.grid.scrollTop+D.grid.clientHeight>D.grid.scrollHeight-500)masGrid()});
D.list.addEventListener('error',function(e){var t=e.target;if(t.tagName==='IMG'&&!t.dataset.fb){t.dataset.fb='1';t.src=FB_LOGO}},true);
[D.mc,D.gc].forEach(function(r){r.addEventListener('error',function(e){var t=e.target;if(t.tagName==='IMG'&&!t.dataset.fb){t.dataset.fb='1';t.src=FB_POSTER}},true)});
$('goPrev').onclick=function(){zap(-1)};
$('goNext').onclick=function(){zap(1)};
$('goBack').onclick=detener;
$('goRot').onclick=function(){S.rotated=!S.rotated;ls.set('gtv_rot',String(S.rotated));aplicarRot();nat('rotarDesdeAndroid',S.rotated);showUI()};
$('shield').onclick=showUI;
window.addEventListener('resize',function(){S.cols=0});
cargarLicLocal();
actualizarBarra();
cargarListaInicial();
setTimeout(function(){
  cargarConfig().then(function(r){
    iniciarApp();
  }).catch(function(e){
    iniciarApp();
  });
},200);
setTimeout(popupNovedades,2500);
})();
</script>
