<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GTV Play R</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@400;700&family=Poppins:wght@400;700&family=Inter:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;background:#000;color:#fff;font-family:'Inter',Arial,Helvetica,sans-serif;overflow:hidden;position:fixed;top:0;left:0;right:0;bottom:0;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
:focus{outline:none}
.hidden{display:none!important}
button{font-family:inherit}
.status-bar{position:fixed;top:0;left:0;right:0;height:52px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;z-index:100;font-size:13px;background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.75) 100%);backdrop-filter: blur(8px);border-bottom: 2px solid rgba(255,215,0,0.3);cursor:pointer;animation: slideDown 0.4s ease-out;}
@keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
.status-bar:focus{background:rgba(255,215,0,0.15);border-bottom-color:#FFD700}
.status-bar.ocultar{display:none}
.status-left{display:flex;align-items:center;gap:10px}
.status-right{display:flex;align-items:center;gap:12px}
.status-text{font-weight:700;letter-spacing:0.5px}
.status-demo{color:#FFD700}.status-full{color:#00ff66}.status-expiring{color:#ff6600}
.status-time{font-family:'Roboto Mono',monospace;font-size:11px;background:rgba(255,255,255,.08);padding:5px 10px;border-radius:20px;border:1px solid rgba(255,255,255,0.1)}
.btn-menu{background:rgba(255,215,0,0.1);color:#FFD700;border:2px solid rgba(255,215,0,0.3);padding:6px 16px;border-radius:24px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s ease;}
.btn-menu:focus{border-color:#FFD700;background:rgba(255,215,0,0.25);transform:scale(1.05);box-shadow:0 0 12px rgba(255,215,0,0.3)}
.btn-menu:active{transform:scale(0.95)}
.view-list{width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:60px 12px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));grid-auto-rows:95px;gap:8px;background:#000}
.view-list.bar-hidden{padding-top:12px}
.card{background:#111;border:2px solid transparent;border-radius:10px;padding:6px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;contain:layout style paint;transition:all 0.2s ease}
.card:active{background:#222;transform:scale(0.96)}
.card:focus{border-color:#FFD700;background:#1a1500;transform:scale(1.05);box-shadow:0 4px 12px rgba(255,215,0,0.2)}
.card img{width:100%;height:42px;object-fit:contain;margin-bottom:6px;pointer-events:none}
.card span{font-size:11px;color:#ccc;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;pointer-events:none;max-width:100%;line-height:1.2}
.card.off{display:none}
.card.caido{opacity:.35;cursor:default}
.card.caido:focus{border-color:#666;background:#1a1a1a;transform:none;box-shadow:none}
.empty{grid-column:1/-1;align-self:start;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 20px;color:#FFD700;height:auto;min-height:calc(100vh - 90px)}
.empty .icon{font-size:64px;margin-bottom:20px;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5))}
.empty .title{font-size:22px;font-weight:800;margin-bottom:12px;letter-spacing:1px}
.empty .subtitle{font-size:14px;color:#aaa;margin-bottom:30px;line-height:1.6;max-width:340px}
.empty button{background:#FFD700;color:#000;border:none;padding:14px 36px;border-radius:50px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 16px rgba(255,215,0,.4);transition:transform 0.2s}
.empty button:focus{outline:3px solid #fff;background:#e6c200;transform:scale(1.05)}
.empty button:active{transform:scale(0.98)}
.empty small{color:#666;margin-top:24px;font-size:11px}
.view-play{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;display:none;z-index:1000}
.view-play.active{display:block}
.wrapper{position:absolute;top:0;left:0;width:100%;height:100%;background:#000}
.wrapper.rotated{top:50%;left:50%;width:100vh;height:100vw;-webkit-transform:translate(-50%,-50%) rotate(90deg);transform:translate(-50%,-50%) rotate(90deg)}
#ifr,#kickIfr,#okIfr,#dailymotionIfr,#tokyvideoIfr{position:absolute;top:0;left:0;width:100%;height:100%;border:0;background:#000;display:none}
.shield{position:absolute;top:0;left:0;right:0;bottom:0;z-index:10}
.ui{position:absolute;top:0;left:0;right:0;bottom:0;z-index:20;pointer-events:none;opacity:0;transition:opacity 0.3s ease}
.ui.show{opacity:1;pointer-events:auto}
.nav-btn{position:absolute;top:50%;margin-top:-40px;width:60px;height:80px;background:rgba(0,0,0,.6);color:#FFD700;border:2px solid #FFD700;border-radius:12px;font-size:34px;cursor:pointer;pointer-events:auto;transition:all 0.2s}
.nav-btn:focus{background:#FFD700;color:#000;transform:scale(1.1)}
.nav-btn.l{left:16px}.nav-btn.r{right:16px}
.nav-btn:active,.float-btn:active{transform:scale(0.9)}
.ui.single .nav-btn{display:none}
.float-btn{position:absolute;right:16px;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.7);color:#FFD700;border:2px solid #FFD700;font-size:22px;cursor:pointer;pointer-events:auto;transition:all 0.2s;display:flex;align-items:center;justify-content:center}
.float-btn:focus{background:#FFD700;color:#000;transform:scale(1.1)}
.btn-back{bottom:16px;background:#a00;border-color:#fff;color:#fff}
.btn-back:focus{background:#fff;color:#a00;border-color:#a00}
.btn-rot{bottom:76px}
.modal{position:absolute;top:24px;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:rgba(0,0,0,.85);padding:10px 20px;border-radius:30px;border:1px solid rgba(255,215,0,0.5);display:flex;align-items:center;gap:12px;pointer-events:none;white-space:nowrap;max-width:90%;backdrop-filter:blur(4px)}
.modal img{height:32px;width:auto;border-radius:6px}
.modal-name{font-size:14px;font-weight:700;color:#FFD700;overflow:hidden;text-overflow:ellipsis}
.modal-count:empty{display:none}
.modal-count{font-size:11px;color:#ccc;background:rgba(255,255,255,0.1);padding:2px 8px;border-radius:10px}
.loader{position:absolute;top:50%;left:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);background:rgba(0,0,0,.9);padding:12px 24px;border-radius:30px;border:2px solid #FFD700;color:#FFD700;font-weight:700;display:none;z-index:30;white-space:nowrap;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,0.5)}
.loader.active{display:block}
.sin-senal{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:35;text-align:center;padding:24px;pointer-events:none}
.sin-senal.hidden{display:none!important}
.sin-senal img{max-height:80px;max-width:220px;margin-bottom:22px;object-fit:contain;opacity:.95}
.sin-senal .ss-nombre{font-size:24px;font-weight:800;color:#FFD700;margin-bottom:14px;letter-spacing:.5px;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sin-senal .ss-msg{font-size:16px;color:#fff;margin-bottom:8px;line-height:1.5;max-width:80%}
.sin-senal .ss-hint{font-size:12px;color:#888;margin-top:6px}
.info-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.96);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;backdrop-filter:blur(5px)}
.info-container{background:#141414;border:2px solid #FFD700;border-radius:24px;padding:28px;max-width:92%;width:480px;text-align:center;margin:auto;font-size:15px;box-shadow:0 20px 60px rgba(0,0,0,0.8)}
.info-container h2{color:#FFD700;margin-bottom:16px;font-size:22px;font-weight:800}
.info-id{background:#000;color:#FFD700;font-family:'Roboto Mono',monospace;font-size:18px;font-weight:700;padding:14px;border-radius:16px;letter-spacing:1px;margin:12px 0;border:1px solid rgba(255,215,0,0.3);word-break:break-all}
.info-pill{display:inline-flex;flex-direction:column;align-items:center;background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.2);border-radius:16px;padding:10px 16px;margin:6px;font-size:13px;min-width:100px}
.info-pill .num{color:#FFD700;font-weight:800;font-size:18px}
.info-pill .lbl{color:#aaa;font-size:11px;margin-top:4px;text-transform:uppercase;letter-spacing:0.5px}
.info-pill.green{background:rgba(46,204,113,.1);border-color:rgba(46,204,113,.3)}.info-pill.green .num{color:#2ecc71}
.info-pill.orange{background:rgba(230,126,34,.1);border-color:rgba(230,126,34,.3)}.info-pill.orange .num{color:#e67e22}
.info-tip{font-size:13px;color:#bbb;margin-top:16px;line-height:1.6;background:rgba(255,255,255,0.03);padding:12px;border-radius:12px}.info-tip strong{color:#FFD700}
.whatsapp-number-tv{background:rgba(37,211,102,.1);border:2px solid #25D366;border-radius:16px;padding:14px;margin:16px 0}
.whatsapp-number-tv .label{color:#25D366;font-size:11px;font-weight:800;letter-spacing:1px;margin-bottom:8px}
.whatsapp-number-tv .number{color:#fff;font-size:22px;font-weight:800;font-family:'Roboto Mono',monospace;letter-spacing:2px}
.button-group{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}
.info-container button,.popup-box button,.toast-blocked button{background:#FFD700;color:#000;border:none;padding:12px 24px;border-radius:40px;font-weight:700;font-size:14px;cursor:pointer;min-width:110px;transition:all 0.2s}
.info-container button:focus,.popup-box button:focus,.toast-blocked button:focus{outline:3px solid #fff;background:#e6c200;transform:scale(1.05)}
.info-container button:active{transform:scale(0.95)}
.close-info,.close-toast{background:#333!important;color:#fff!important}
.close-info:focus,.close-toast:focus{background:#555!important;outline-color:#aaa!important}
.whatsapp-btn{background:#25D366!important;color:#fff!important}
.toast-blocked{position:fixed;bottom:90px;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:#000;border:2px solid #FFD700;border-radius:30px;padding:14px 24px;z-index:10001;display:flex;gap:16px;align-items:center;font-size:14px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.6)}
.toast-blocked span{color:#FFD700;font-weight:700}
.popup-box{background:#141414;border:3px solid #FFD700;border-radius:24px;padding:30px;max-width:550px;width:90%;max-height:85vh;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.8)}
.popup-box .ptitle{font-size:15px;color:#FFD700;font-weight:800;letter-spacing:2px;margin-bottom:16px}
.popup-box .ptext{color:#e0e0e0;font-size:16px;line-height:1.7;max-height:55vh;overflow-y:auto}
.popup-box button{margin-top:24px;padding:14px 48px}
.set-box{text-align:left;max-height:90vh;overflow-y:auto;width:100%;max-width:520px;font-size:15px}
.set-box h2{text-align:center;margin-bottom:24px;font-size:24px}
.set-sec{font-size:13px;color:#FFD700;font-weight:800;letter-spacing:1.5px;margin:24px 0 12px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.set-sec::after{content:'';flex:1;height:1px;background:rgba(255,215,0,0.2)}
.set-row{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.set-input{flex:1;min-width:0;background:#0a0a0a;color:#fff;border:2px solid #333;border-radius:12px;padding:14px 16px;font-size:15px;transition:border-color 0.2s}
.set-input:focus{border-color:#FFD700;outline:none}
.set-empty{color:#888;font-size:14px;text-align:center;padding:16px 0;background:rgba(255,255,255,0.02);border-radius:12px;border:1px dashed #333}
.set-option-card {background: #111;border: 2px solid #333;border-radius: 14px;padding: 16px 52px 16px 16px;cursor: pointer;transition: all 0.25s ease;display: flex;align-items: center;gap: 16px;margin-bottom: 12px;position: relative;overflow: hidden;}
.set-option-card::before {content: '';position: absolute;top: 0; left: 0; width: 4px; height: 100%;background: transparent;transition: background 0.25s ease;}
.set-option-card:focus, .set-option-card.selected {border-color: #FFD700;background: #1a1500;transform: translateX(4px);box-shadow: 0 4px 16px rgba(255,215,0,0.15);}
.set-option-card:focus::before, .set-option-card.selected::before {background: #FFD700;}
.set-option-card .icon { font-size: 28px; flex-shrink: 0; }
.set-option-card .title { font-weight: 800; font-size: 17px; color: #fff; margin-bottom: 4px; }
.set-option-card .desc { font-size: 13px; color: #aaa; line-height: 1.4; }
.set-option-card .check {position: absolute; right: 16px; top: 50%; transform: translateY(-50%);width: 24px; height: 24px; border-radius: 50%; border: 2px solid #555;display: flex; align-items: center; justify-content: center;transition: all 0.25s ease;}
.set-option-card.selected .check {background: #FFD700; border-color: #FFD700; color: #000;}
.set-option-card.selected .check::after {content: '✓'; font-weight: 900; font-size: 14px;}
.s-item{display:flex;align-items:center;gap:12px;background:#111;border:1px solid #222;border-radius:14px;padding:12px 14px;margin-bottom:10px;transition:all 0.2s}
.s-item:focus-within{border-color:#FFD700}
.s-info{flex:1;min-width:0}
.s-info b{display:block;font-size:15px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.s-info small{font-size:12px;color:#888;margin-top:2px;display:block}
.info-container .s-item button{min-width:0;padding:10px 14px;font-size:13px;border-radius:10px}
.info-container .s-del{background:#2a1111;color:#ff6b6b;border:1px solid rgba(255,107,107,0.2)}
.info-container .s-del:focus{background:#c0392b;color:#fff;border-color:#c0392b}
.s-use{background:rgba(255,215,0,0.1);color:#FFD700;border:1px solid rgba(255,215,0,0.3)}
.s-use:focus{background:#FFD700;color:#000}
.menu-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.94);z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.rueda{position:relative;flex-shrink:0}
.rueda-aro{position:absolute;border:2px dashed rgba(255,215,0,.22);border-radius:50%;pointer-events:none}
.rueda-hub{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 30%,#1f1800,#0b0b0b 72%);border:2px solid rgba(255,215,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;pointer-events:none;overflow:hidden}
.hub-ico{font-size:34px;line-height:1}
.hub-t{font-size:19px;font-weight:800;color:#FFD700;margin-top:6px;line-height:1.15}
.hub-v{display:inline-block;margin-top:5px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.45);color:#FFD700;border-radius:20px;padding:2px 12px;font-size:12px;font-weight:800}
.hub-d{font-size:12px;color:#aaa;line-height:1.35;margin-top:6px;max-width:100%}
.rueda-it{position:absolute;border-radius:50%;background:#151515;border:2px solid #333;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;transition:-webkit-transform .15s,transform .15s,background .15s,border-color .15s}
.rueda-it:focus{background:#FFD700;border-color:#fff;-webkit-transform:scale(1.22);transform:scale(1.22);box-shadow:0 0 0 4px rgba(255,215,0,.25),0 8px 22px rgba(0,0,0,.7);z-index:2}
.rueda-it:active{-webkit-transform:scale(.94);transform:scale(.94)}
.rueda-hint{margin-top:18px;color:#777;font-size:12px;text-align:center}
.rueda-x{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;background:#222;color:#fff;border:2px solid #444;font-size:18px;cursor:pointer}
.rueda-x:focus{background:#c0392b;border-color:#fff}
.set-help{color:#aaa;font-size:14px;text-align:center;margin:-8px 0 16px;line-height:1.5}
.aviso-mini{position:fixed;left:50%;bottom:64px;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:#000;border:2px solid #FFD700;color:#FFD700;padding:10px 20px;border-radius:30px;font-weight:700;font-size:14px;z-index:10050;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.aviso-mini.on{opacity:1}
.status-col{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.status-sub{font-size:11px;color:#bdbdbd;letter-spacing:.4px;line-height:1.1;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;overflow-y:auto}
.block-screen .box{max-width:340px;width:100%}
.block-screen button{background:#25D366;color:#fff;border:none;padding:14px 24px;border-radius:50px;font-size:15px;font-weight:700;cursor:pointer;margin:8px 0;width:100%;max-width:260px;transition:transform 0.2s}
.block-screen button:focus{outline:3px solid #fff;transform:scale(1.05)}
.block-screen button.alt{background:#FFD700;color:#000}
#movies{display:none;width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#0a0a0a}
#movies.active{display:block}
.peliculas-header{position:sticky;top:0;background:rgba(5,5,5,0.95);backdrop-filter:blur(8px);padding:0 20px;z-index:99;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(229,9,20,.3);height:60px}
.peliculas-logo{white-space:nowrap;font-size:18px;font-weight:800;color:#fff;cursor:pointer;padding:8px 14px;border-radius:12px;border:2px solid transparent;transition:all 0.2s}
.peliculas-counter{white-space:nowrap;background:linear-gradient(135deg,#f1c40f,#e67e22);padding:6px 16px;border-radius:40px;font-size:13px;font-weight:800;color:#000;cursor:pointer;border:2px solid transparent;transition:all 0.2s}
.peliculas-logo:focus,.peliculas-counter:focus{border-color:#FFD700;background-color:#1a1a1a;transform:scale(1.05)}
.hint{font-size:10px;color:#777;position:absolute;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);pointer-events:none}
#mcontent{padding:10px 0 40px}
.msg{text-align:center;padding:60px 20px;color:#FFD700;font-size:16px}.msg.err{color:#E50914}
.peliculas-section{margin:20px 0 12px}
.section-header{padding:0 20px 10px}
.section-title{font-size:18px;font-weight:700;position:relative;display:inline-block;padding-bottom:8px}
.section-title:after{content:'';position:absolute;bottom:0;left:0;width:40px;height:3px;background:#E50914;border-radius:2px}
.slider-container{overflow-x:auto;padding:8px 20px 16px;scrollbar-width:none}
.slider-container::-webkit-scrollbar{display:none}
.cards-slider{display:flex;gap:12px}
.pelicula-card,.ver-todos-card{width:140px;flex-shrink:0;position:relative;border-radius:12px;overflow:hidden;cursor:pointer;background:#1a1a1a;border:2px solid transparent;transition:all 0.2s ease}
.pelicula-card:focus,.ver-todos-card:focus{border-color:#FFD700;transform:scale(1.05);z-index:10;box-shadow:0 8px 24px rgba(0,0,0,0.6)}
.pelicula-card-img{position:relative;height:0;padding-bottom:150%;overflow:hidden;background:#111}
.pelicula-card-img img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.pelicula-card-img:after{content:'';position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(to top,rgba(0,0,0,.95),transparent);pointer-events:none}
.pelicula-year-badge{position:absolute;top:8px;right:8px;background:#E50914;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;z-index:3}
.pelicula-type-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);padding:3px 8px;border-radius:20px;font-size:9px;z-index:3}
.pelicula-new-badge{position:absolute;top:34px;left:8px;background:#2ecc71;color:#000;font-size:8px;font-weight:800;padding:2px 8px;border-radius:20px;z-index:4}
.pelicula-card-info{position:absolute;bottom:0;left:0;right:0;padding:30px 10px 12px;z-index:3}
.pelicula-card-title{font-size:12px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.pelicula-fav-btn{position:absolute;bottom:50px;left:8px;background:rgba(0,0,0,.6);color:#f1c40f;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;font-size:15px;z-index:5;transition:all 0.2s}

    if (!f) return 0;
    var s = String(f).trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return new Date(s.slice(0, 10)).getTime();
    var m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if (m) return new Date(m[3] + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0')).getTime();
    var d = new Date(s);

}

}

function litePref(){var p=ls.get('gtv_lite','auto');return (p==='1'||p==='0')?p:'auto'}
function litNombre(p){return p==='1'?'Liviano':(p==='0'?'Completo':'Automático')}
function aplicarLite(){
  var p=litePref();
  if(p==='1')LITE=true;else if(p==='0')LITE=false;else LITE=AUTO_LITE;
  document.body.classList.toggle('lite',LITE);
}
function ciclarLite(){
  var p=litePref(),n=p==='auto'?'1':(p==='1'?'0':'auto');
  ls.set('gtv_lite',n);aplicarLite();return n;
}

function abrirMenu(sel){

     '<button class="rueda-x" data-skip="1" tabindex="0" aria-label="Cerrar">✕</button>';

  var R=Math.round(size*0.38),b=Math.max(52,Math.min(72,Math.round(size*0.17))),c=size/2;
  rueda.style.width=rueda.style.height=size+'px';
  var aro=el.querySelector('#ruedaAro');

  aro.style.left=aro.style.top=(c-R)+'px';

  hub.style.left=hub.style.top=Math.round(c-hs/2)+'px';

function activarMenu(it,i,pintar){
  switch(it.id){
    case 'rep': irA(function(){panelReproductor(i)}); break;
    case 'lis': irA(function(){panelListas(i)}); break;
    case 'peli': {
      var k=idxPeliculas();
      irA(function(){if(k>=0)play(k,'user')});
      break;
    }
    case 'lic': irA(function(){infoDialog(i)}); break;
    case 'upd': actualizarTodo(); break;
    case 'rend': {
      var nv=ciclarLite();
      pintar(i);
      aviso('⚡ Rendimiento: '+litNombre(nv));
      break;
    }
    case 'sal': nat('salirApp'); break;
  }

  } else if(d.licencias && typeof d.licencias==='object'){

  aplicarConfigPub(d);

    window.CANAL_OFICIAL = Object.assign({ activo:false, nombre:'GTV OFICIAL', url:'', logo:'', referer:'', gain:1.0 }, d.canalOficial);
    try { localStorage.setItem('gtv_canal_oficial', JSON.stringify(window.CANAL_OFICIAL)); } catch(e){}
  }
  // si la lista ya está cargada, se re-arma ahora (si el panel cambió algo)
  try { reaplicarOficial(); } catch(e){}
  // ==========================================
}

function cargarConfig(){
  if(hasNat('getConfigNativa')){
    try{
      var raw = nat('getConfigNativa');
      if(raw && raw.length){
        var d = JSON.parse(raw);
        if(!d.hash_esperado || hashUrl(CONFIG_URL)===d.hash_esperado){ aplicarConfig(d); return Promise.resolve('ok'); }
        aplicarConfig(d); return Promise.resolve('hash');
      }
    }catch(e){}
  }
  return fetchW(CONFIG_URL+'?t='+Date.now(),12000).then(function(r){
    if(!r.ok)return 'net';
    return r.json().then(function(d){
      if(!d.hash_esperado || hashUrl(CONFIG_URL)===d.hash_esperado){ aplicarConfig(d); return 'ok'; }
      aplicarConfig(d); return 'hash';
    });
  }).catch(function(){return 'net'});
}

var IO = null;
function lazyObserve(root){
  var l=root.querySelectorAll('img[data-src]'),i;
  if(!window.IntersectionObserver){
    for(i=0;i<l.length;i++){l[i].src=l[i].getAttribute('data-src');l[i].removeAttribute('data-src')}
    return;
  }
  if(!IO)IO=new IntersectionObserver(function(es){
    for(var k=0;k<es.length;k++){
      if(!es[k].isIntersecting)continue;
      var im=es[k].target,s=im.getAttribute('data-src');
      if(s){im.src=s;im.removeAttribute('data-src')}
      IO.unobserve(im);
    }
  },{root:D.list,rootMargin:(LITE?'150px 0px':'400px 0px')});
  for(i=0;i<l.length;i++)IO.observe(l[i]);
}

function sincronizarEstadoCanales(){
  var aplicarEstado = function(d){
    if(!d||!d.ok)return;
    S.caidos=d.caidos||{};
    S.ocultos=d.ocultos||{};
    S.hideCargado=true;
    ls.setJ('gtv_caidos_cache',S.caidos);
    ls.setJ('gtv_ocultos_cache',S.ocultos);
    if(S.list.length){renderLista();syncNativo()}
  };
  if(hasNat('getEstadoCanalesNativo')){
    try{
      var raw = nat('getEstadoCanalesNativo');
      if(raw && raw.length){ aplicarEstado(JSON.parse(raw)); return Promise.resolve(); }
    }catch(e){}
  }
  return fetchW(ESTADO_URL+'?t='+Date.now(),8000).then(function(r){return r.json()}).then(aplicarEstado).catch(noop);
}

}

function play(i,origin){
  origin=origin||'user';
  if(i<0||i>=S.list.length)return;
  var now=Date.now();
  if(origin!=='zap'&&origin!=='native'){
    if(now-S.exitAt<BLOQUEO_MS)return;
    if(origin==='user'){
      if(S.native||S.view!=='list'||S.dlg)return;
      if(S.lastI===i&&now-S.lastAt<1200)return;
    }
  }
  if(!tieneLicencia()&&!demoActiva()){ toastBloqueo(); return; }
  
  var ch=S.list[i];
  if(S.caidos[ch.url]){mostrarSinSenal(ch);return}
  if(S.ocultos[ch.url]){zapCanales(1);return}
  
  limpiarModales();
  S.lastI=i;S.lastAt=now;S.index=i;
  ls.set('gtv_last_index',String(i));
  nat('sincronizarIndice',i);
  
  if(ch.esPeliculas&&ch.urlPeliculasM3U){abrirPeliculas(ch.urlPeliculasM3U);return}
  S.fromMovies=false;
  lanzar(ch,i,totalVisible());
}

  for(var k=0;k<visibles.length;k++)if(visibles[k]===S.index){posActual=k;break}

// === CANAL OFICIAL - SIEMPRE EN POSICIÓN #1 (fuera de cualquier M3U) ===
// Se guarda la lista "base" que manda Android y se le antepone el canal oficial.
// Se re-arma cuando llega la lista Y cuando llega/cambia la config del panel.
window.__baseLista = null;
window.__coSig = null;

function oficialActivo(){
  var co = window.CANAL_OFICIAL;
  return !!(co && co.activo === true && co.url && String(co.url).trim());
}
function firmaOficial(){
  var co = window.CANAL_OFICIAL || {};
  return oficialActivo() ? [co.nombre, co.url, co.logo, co.referer, co.gain].join('|') : '';
}
function armarLista(base){
  var nl = [], co = window.CANAL_OFICIAL || {}, i, c, nom;
  var urlOf = oficialActivo() ? String(co.url).trim() : '';
  if (urlOf) {
    nom = co.nombre || 'GTV OFICIAL';
    nl.push({ nombre: nom, name: nom, url: urlOf, logo: co.logo || '', referer: co.referer || '',
              gain: co.gain || 1.0, esOficial: true, esPeliculas: false, urlPeliculasM3U: null });
  }
  for (i = 0; i < base.length; i++) {
    c = base[i];
    if (!c || !c.url) continue;
    if (urlOf && c.url === urlOf) continue;           // si ya estaba en la M3U, no se duplica
    nom = c.nombre || c.name || 'Canal ' + (i + 1);
    nl.push({ nombre: nom, name: nom, url: c.url, logo: c.logo || '', referer: c.referer || '',
              gain: c.gain || 1.0, esOficial: false, esPeliculas: !!c.esPeliculas,
              urlPeliculasM3U: c.urlPeliculasM3U || null });
  }
  return nl;
}
function aplicarArmada(nl){
  // mantiene el canal seleccionado por URL (aunque el oficial se prenda/apague y corra los índices)
  var prev = (S.list.length && S.list[S.index]) ? S.list[S.index].url : null, li = -1, i;
  if (prev) for (i = 0; i < nl.length; i++) if (nl[i].url === prev) { li = i; break; }
  if (li >= 0) { ls.set('gtv_last_index', String(li)); aplicarLista(nl, true); }
  else aplicarLista(nl, false);
}
function reaplicarOficial(){
  if (!window.__baseLista) return;                    // todavía no llegó la lista: gtvSetCanales lo va a hacer
  var f = firmaOficial();
  if (f === window.__coSig) return;                   // el panel no cambió nada
  window.__coSig = f;
  aplicarArmada(armarLista(window.__baseLista));
}
window.gtvSetCanales = function(json) {
  try {
    var arr = typeof json === 'string' ? JSON.parse(json) : json;
    if (!Array.isArray(arr)) return;
    window.__baseLista = arr;
    window.__coSig = firmaOficial();
    aplicarArmada(armarLista(arr));
  } catch (e) {
    console.error('Error en gtvSetCanales:', e);
  }
};

var GEN={'romántica':'Romance','romantica':'Romance','accion':'Acción'};
function normGenero(g){var k=g.toLowerCase();return GEN[k]||(g.charAt(0).toUpperCase()+g.slice(1).toLowerCase())}

function detectarSerie(title){
  var reT=/(^|[^a-z'’])(?:temporada|season|serie|temp|t|s)\s*0?(\d{1,2})(?!\d)/i;
  var reC=/(^|[^a-z'’])(?:cap[ií]tulo|episodio|episode|cap|ep|c|e)\s*0?(\d{1,3})(?!\d)/i;
  var s=title,temp=1,cap=0,es=false,m;
  if((m=s.match(reT))){temp=parseInt(m[2],10);es=true;s=s.replace(m[0],m[1])}
  if((m=s.match(reC))){cap=parseInt(m[2],10);es=true;s=s.replace(m[0],m[1])}
  s=s.replace(/\s{2,}/g,' ').replace(/^[\s-]+|[\s-]+$/g,'');
  if(!es||!s)return {es:false,nombre:title,temp:1,cap:0};
  return {es:true,nombre:s,temp:temp,cap:cap};
}

function serieDe(it){return it._s||(it._s=detectarSerie(it.title))}

function slim(it){return {title:it.title,logo:it.logo,url:it.url,genre:it.genre,year:it.year}}

function agrupar(items,prefix){
  var map={},out=[];
  items.forEach(function(it){
    var s=serieDe(it);
    if(!s.es){out.push(it);return}
    var key=prefix+'|'+s.nombre+'|'+s.temp,t=map[key];
    if(!t){t={serie:true,key:key,title:s.nombre+' T'+s.temp,serieNombre:s.nombre,temporada:s.temp,caps:[],logo:it.logo,year:it.year||'N/S',genre:it.genre};map[key]=t;out.push(t);M.series.set(key,t)}
    t.caps.push(it);
  });
  out.forEach(function(t){if(t.serie)t.caps.sort(function(a,b){return serieDe(a).cap-serieDe(b).cap})});
  return out;
}

function parsePelis(text){
  var items=[],lines=text.split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var fl=lines[i];
    if(fl.indexOf('#EXTINF')!==0)continue;
    var url='';
    for(var j=i+1;j<i+5&&j<lines.length;j++){
      var l2=lines[j].trim();
      if(/^https?:\/\//i.test(l2)){url=l2;break}
      if(l2.indexOf('#EXTINF')===0)break;
    }
    if(!url)continue;
    var gm=fl.match(/group-title="([^"]*)"/i),genre=normGenero((gm&&gm[1].trim())||'General');
    var lg=fl.match(/tvg-logo="([^"]*)"/i),logo=(lg&&lg[1])||FB_POSTER;
    var title='',c=fl.lastIndexOf(',');
    if(c!==-1&&c<fl.length-1)title=fl.substring(c+1).trim().replace(/^["']|["']$/g,'');
    if(!title){var tn=fl.match(/tvg-name="([^"]*)"/i);if(tn)title=tn[1].trim()}
    if(!title)title='Sin nombre';
    var ym=title.match(/\b(19|20)\d{2}\b/),year;
    if(ym)year=ym[0];
    else{var all=fl.match(/\b(19|20)\d{2}\b/g);year=all?all[all.length-1]:'N/S'}
    items.push({title:title,logo:logo,url:url,genre:genre,year:year,h:hnum(title+'|'+url)});
  }
  M.items=items;
  M.byUrl=new Map();
  items.forEach(function(it){M.byUrl.set(it.url,it)});
  var prev=ls.getJ('gtv_pelis_fp',null),nuevo=ls.getJ('gtv_pelis_new',{}),now=Date.now();
  if(prev){var ps=new Set(prev);items.forEach(function(it){if(!ps.has(it.h))nuevo[it.h]=now})}
  Object.keys(nuevo).forEach(function(k){if(now-nuevo[k]>NUEVO_DIAS*86400000)delete nuevo[k]});
  M.nuevo=nuevo;
  ls.setJ('gtv_pelis_fp',items.map(function(it){return it.h}));
  ls.setJ('gtv_pelis_new',nuevo);
  M.series.clear();M.reco=null;
  M.tiles=agrupar(items,'c');
  var gm2={};
  M.tiles.forEach(function(t){var g=t.genre||'General';(gm2[g]||(gm2[g]=[])).push(t)});
  M.genres=Object.keys(gm2).map(function(g){return {name:g,tiles:gm2[g],prev:shuffle(gm2[g].slice()).slice(0,8)}});
  shuffle(M.genres);
}

function keyName(e){
  switch(e.key){
    case 'Enter':case 'OK':case 'Select':case 'Accept':return 'ok';
    case 'Escape':case 'Backspace':case 'GoBack':case 'BrowserBack':return 'back';
    case 'ArrowUp':return 'up';
    case 'ArrowDown':return 'down';
    case 'ArrowLeft':return 'left';
    case 'ArrowRight':return 'right';
    case 'ChannelUp':return 'chup';
    case 'ChannelDown':return 'chdn';
  }
  switch(e.keyCode){
    case 13:case 23:case 66:return 'ok';
    case 4:case 8:case 27:return 'back';
    case 38:return 'up';case 40:return 'down';case 37:return 'left';case 39:return 'right';
    case 427:return 'chup';case 428:return 'chdn';
  }
  return null;
}

function normTxt(t){
  t=String(t==null?'':t).toLowerCase();
  try{t=t.normalize('NFD').replace(/[̀-ͯ]/g,'')}
  catch(e){t=t.replace(/[áàäâ]/g,'a').replace(/[éèëê]/g,'e').replace(/[íìïî]/g,'i').replace(/[óòöô]/g,'o').replace(/[úùüû]/g,'u').replace(/ñ/g,'n')}
  return t.replace(/&/g,' y ').replace(/[^a-z0-9]+/g,' ').replace(/^ +| +$/g,'');
}
function toks(q){
  var a=q?q.split(' '):[],out=[];
  for(var i=0;i<a.length;i++)if(a[i]&&!STOP[a[i]])out.push(a[i]);
  return out.length?out:a.filter(Boolean);
}
function aDigitos(q){
  var a=q.split(' '),ch=false;
  for(var i=0;i<a.length;i++)if(NUMS[a[i]]!==undefined){a[i]=NUMS[a[i]];ch=true}
  return ch?a.join(' '):q;
}
function aLetras(q){
  var a=q.split(' '),ch=false;
  for(var i=0;i<a.length;i++)if(LETRAS[a[i]]!==undefined){a[i]=LETRAS[a[i]];ch=true}
  return ch?a.join(' '):q;
}
function pegar(q){
  var a=q.split(' '),out=[],cur=a[0]||'';
  for(var i=1;i<a.length;i++){
    if(cur.length===1||a[i].length===1)cur+=a[i];
    else{out.push(cur);cur=a[i]}
  }
  out.push(cur);
  return out.join(' ');
}
function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max)return max+1;
  var prev=[],cur=[],i,j;
  for(j=0;j<=b.length;j++)prev[j]=j;
  for(i=1;i<=a.length;i++){
    cur[0]=i;var mn=cur[0];
    for(j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
      if(cur[j]<mn)mn=cur[j];
    }
    if(mn>max)return max+1;
    var t=prev;prev=cur;cur=t;
  }
  return prev[b.length];
}
function ptsToken(t,ws){
  var best=0,tol=t.length>=7?2:(t.length>=4?1:0);
  for(var i=0;i<ws.length;i++){
    var w=ws[i],p=0;
    if(w===t)p=100;
    else if(w.indexOf(t)===0)p=85;
    else if(t.length>=3&&w.indexOf(t)>0)p=55;
    else if(tol&&w.length>=3&&lev(t,w,tol)<=tol)p=60;
    else if(tol&&w.length>t.length&&lev(t,w.substr(0,t.length),tol)<=tol)p=50;
    if(p>best)best=p;
  }
  return best;
}
function puntaje(nt,nk,q,qk,qt){
  if(!nt)return 0;
  if(nt===q)return 1000;
  var sc=0,ws=nt.split(' ');
  if(nt.indexOf(q)===0)sc=800-Math.min(nt.length-q.length,100);
  else if((' '+nt+' ').indexOf(' '+q+' ')>=0)sc=650-Math.min(nt.length-q.length,100);
  if(qk&&nk){
    if(nk===qk)sc=Math.max(sc,950);
    else if(nk.indexOf(qk)===0)sc=Math.max(sc,780-Math.min(nk.length-qk.length,100));
    else if((' '+nk+' ').indexOf(' '+qk+' ')>=0)sc=Math.max(sc,640-Math.min(nk.length-qk.length,100));
  }
  var tot=0;
  for(var i=0;i<qt.length;i++){
    var p=ptsToken(qt[i],ws);
    if(!p)return sc;
    tot+=p;
  }
  var f=Math.round(tot/qt.length)*3-Math.min(nt.length,80)/4;
  return Math.max(sc,f);
}
function buscarEn(cands,q,q2){
  var qs=[q];
  if(q2&&q2!==q)qs.push(q2);
  for(var z=qs.length-1;z>=0;z--){var al=aDigitos(qs[z]);if(qs.indexOf(al)<0)qs.push(al)}
  for(var y=qs.length-1;y>=0;y--){var lt=aLetras(qs[y]);if(qs.indexOf(lt)<0)qs.push(lt);var pg=pegar(lt);if(qs.indexOf(pg)<0)qs.push(pg)}
  var out=[];
  for(var i=0;i<cands.length;i++){
    var c=cands[i],best=0;
    if(c.nk===undefined)c.nk=toks(c.nt).join(' ');
    for(var k=0;k<qs.length;k++){
      var qt=toks(qs[k]),sc=puntaje(c.nt,c.nk,qs[k],qt.join(' '),qt);
      if(sc>best)best=sc;
    }
    if(best>=120){c.sc=best;out.push(c)}
  }
  out.sort(function(a,b){return b.sc-a.sc||a.nt.length-b.nt.length});
  return out;
}

    if(S.ocultos[c.url])continue;
    var n=c.nombre||c.name||'';
    out.push({tipo:'canal',i:i,nombre:n,logo:c.logo||'',caido:!!S.caidos[c.url],nt:normTxt(n),sub:c.esPeliculas?'Películas y series':''});
  }
  B.cc=out;B.ccL=S.list;B.ccO=S.ocultos;B.ccC=S.caidos;
  return out;
}
function candidatosPelis(){
  if(B.cp&&B.cpT===M.tiles)return B.cp;
  var out=[],t=M.tiles||[];
  for(var i=0;i<t.length;i++){
    var x=t[i],n=x.serie?x.serieNombre+' · Temporada '+x.temporada:x.title;
    out.push({tipo:'peli',t:x,nombre:n,logo:x.logo||'',nt:normTxt(x.serie?x.serieNombre:x.title),
      sub:x.serie?('📺 Serie · '+x.caps.length+' capítulos'):('🎬 '+(x.genre||'')+(x.year&&x.year!=='N/S'?' · '+x.year:''))});
  }
  B.cp=out;B.cpT=M.tiles;
  return out;
}
function enPelis(){return S.view==='movies'}

var RE_DIR=/^(?:(?:por favor|porfa|ok|oye|che)\s+)?(?:abri|abrir|abre|abrime|abrirme|reproduci|reproducir|reproduce|reproducime|pone|poner|ponme|ponele|poneme|pon|quiero ver|quiero mirar|quiero|queria ver|me gustaria ver|ver|mirar|mira|miro|veo|sintoniza|sintonizar|cambia a|cambiar a|anda a|ir a|pasa a|pasame|llevame a)\s+/;
var RE_BUS=/^(?:(?:por favor|porfa)\s+)?(?:busca|buscar|buscame|busco|encontra|encontrar|encontrame)\s+/;
var RE_ART=/^(?:(?:el|la|los|las|un|una)\s+)?(?:canal|canales|pelicula|peliculas|serie|series|film|programa|capitulo)\s+(?:de\s+|del\s+)?/;
function interpretar(raw){
  var t=normTxt(raw),directo=false,m;
  if((m=t.match(RE_DIR))){directo=true;t=t.substr(m[0].length)}
  else if((m=t.match(RE_BUS))){t=t.substr(m[0].length)}
  t=t.replace(/\s+(?:por favor|porfa|gracias)$/,'').replace(/^(?:el|la|los|las)\s+/,'');
  var q2=t.replace(/^ +| +$/g,'');
  t=t.replace(RE_ART,'');
  return {q:t.replace(/^ +| +$/g,''),q2:q2,directo:directo};
}

function busCerrar(){if(S.dlg&&S.dlg.esBuscador){nat('detenerVoz');cerrarDialogo()}}
function busEstado(txt,cls){
  var e=$('busEstado');if(!e)return;
  e.textContent=txt||'';e.className='bus-estado'+(cls?' '+cls:'');
}

function busAbrirRes(r){
  if(S.dlg)S.dlg.onClose=null;
  nat('detenerVoz');
  cerrarDialogo();
  if(r.tipo==='canal'){
    if(r.caido){mostrarSinSenal(S.list[r.i]);return}
    S.index=r.i;
    play(r.i,'user');
  }else{
    var t=r.t;
    if(t.serie)reproPeli(t.caps[0]);
    else{var it=buscarItem(t.url);if(it)reproPeli(it)}
  }
}
function busAbrirLista(r){
  if(r.tipo==='peli'&&r.t.serie){
    if(S.dlg)S.dlg.onClose=null;
    nat('detenerVoz');cerrarDialogo();
    openGrid('📺 '+r.t.serieNombre+' - Temporada '+r.t.temporada,r.t.caps,true);
    return;
  }
  busAbrirRes(r);
}

function busPintar(){
  var box=$('busRes');if(!box)return;
  if(!B.q){box.innerHTML='';return}
  if(!B.res.length){box.innerHTML='<div class="set-empty">Sin resultados para “'+esc(B.q)+'”.</div>';return}
  var h='',lim=Math.min(B.res.length,40);
  for(var i=0;i<lim;i++){
    var r=B.res[i];
    h+='<button class="bus-it'+(r.tipo==='peli'?' peli':'')+(r.caido?' caido':'')+'" data-r="'+i+'"><img src="'+esc(r.logo||(r.tipo==='peli'?FB_POSTER:FB_LOGO))+'" alt="" decoding="async"><span class="bt"><b>'+esc(r.nombre)+'</b><small>'+esc(r.caido?'Sin señal por ahora':r.sub)+'</small></span></button>';
  }
  box.innerHTML=h;
  Array.prototype.forEach.call(box.querySelectorAll('.bus-it'),function(b){
    b.onclick=function(){busAbrirLista(B.res[parseInt(b.dataset.r,10)])};
  });
  var ims=box.querySelectorAll('img');
  Array.prototype.forEach.call(ims,function(im){im.onerror=function(){if(!im.dataset.fb){im.dataset.fb='1';im.src=FB_LOGO}}});
}

function busEjecutar(texto,modo){
  var desdeVoz=(modo==='voz');
  var p=interpretar(texto);
  if(modo==='tipeo')p.directo=false;
  B.q=p.q;
  var inp=$('busInput');
  if(inp&&desdeVoz)inp.value=p.q;
  if(!p.q){B.res=[];busPintar();return}
  var pel=enPelis();
  if(pel&&!(M.tiles&&M.tiles.length)){busEstado('⏳ Todavía se están cargando los títulos…','err');B.res=[];busPintar();return}
  B.res=buscarEn(pel?candidatosPelis():candidatosCanales(),p.q,p.q2);
  if(!B.res.length&&!pel&&/pelicula|serie|capitulo/.test(normTxt(texto))){
    busEstado('Para buscar películas entrá a GPLIS CINEMA y apretá 🔍 ahí.','err');
  }
  busPintar();
  if(!B.res.length){if(!/Para buscar/.test(($('busEstado')||{}).textContent||''))busEstado('No encontré “'+p.q+'”','err');return}
  var top=B.res[0],sec=B.res[1];
  var claro=!sec||top.sc>=1000||(top.sc-sec.sc)>=120||(sec.nt===top.nt);
  if(p.directo&&claro){
    busEstado('▶ Abriendo '+top.nombre+'…','on');
    var pick=top;
    for(var i=0;i<B.res.length&&B.res[i].nt===top.nt;i++){if(!B.res[i].caido){pick=B.res[i];break}}
    busAbrirRes(pick);
    return;
  }
  busEstado(p.directo?'Hay varias coincidencias, elegí una':(B.res.length+' resultado'+(B.res.length>1?'s':'')),'');
  var f=$('busRes')&&$('busRes').querySelector('.bus-it');
  if(desdeVoz&&f)f.focus();
}

window.gtvVoz=function(estado,texto){
  if(!S.dlg||!S.dlg.esBuscador)return;
  var mic=$('busMic');
  if(mic)mic.classList.toggle('on',estado==='escuchando'||estado==='parcial');
  switch(estado){
    case 'escuchando':busEstado('🎙️ Escuchando… hablá ahora','on');break;
    case 'parcial':{var i=$('busInput');if(i)i.value=texto;busEstado('🎙️ '+texto,'on');break}
    case 'final':busEstado('🔎 '+texto,'on');busEjecutar(texto,'voz');break;
    case 'sin-voz':busEstado('No te escuché. Tocá 🎤 o escribí con el teclado.','err');break;
    case 'red':busEstado('La voz necesita internet. Escribí con el teclado.','err');break;
    case 'permiso-denegado':busEstado('Falta el permiso del micrófono. Escribí con el teclado.','err');break;
    case 'no-soportado':B.voz=false;if(mic)mic.style.display='none';busEstado('Este equipo no tiene voz. Escribí con el teclado.','err');break;
    case 'ocupado':busEstado('El micrófono está ocupado, probá de nuevo.','err');break;
    default:busEstado('No se pudo usar la voz. Escribí con el teclado.','err');
  }
};

function abrirBuscador(){
  if(S.locked||S.native||S.grid)return;
  if(S.view!=='list'&&S.view!=='movies')return;
  if(S.dlg){if(S.dlg.esBuscador)busCerrar();return}
  var pel=enPelis();
  B.q='';B.res=[];
  B.voz=!!(hasNat('vozDisponible')&&nat('vozDisponible'));
  var h='<div class="info-container set-box bus-box"><h2>'+(pel?'Buscar en GPLIS CINEMA':'Buscar canal')+'</h2>'+
    '<p class="set-help">'+(B.voz?'Decí por ejemplo: “abrí '+(pel?'Romeo y Julieta':'Gente B')+'”':'Escribí el nombre')+'</p>'+
    '<div class="set-row"><input id="busInput" class="set-input" type="text" placeholder="'+(pel?'Película o serie…':'Nombre del canal…')+'" autocomplete="off" spellcheck="false">'+
    (B.voz?'<button id="busMic" class="bus-mic" aria-label="Hablar">'+ICO_MIC+'</button>':'')+'</div>'+
    '<div class="bus-estado" id="busEstado"></div><div id="busRes"></div>'+
    '<div class="button-group"><button id="busCerrar" class="close-info">✕ Cerrar</button></div></div>';
  var d=abrirDialogo(h,'info-overlay',function(){nat('detenerVoz');restaurarFoco()});
  d.esBuscador=true;
  var el=d.el,inp=el.querySelector('#busInput');
  inp.addEventListener('input',function(){
    clearTimeout(B.tid);
    B.tid=setTimeout(function(){busEjecutar(inp.value,'tipeo')},140);
  });
  inp.addEventListener('keydown',function(e){
    if(e.keyCode===13||e.key==='Enter'){
      e.preventDefault();clearTimeout(B.tid);busEjecutar(inp.value,'enter');
      var f=el.querySelector('.bus-it');if(f)f.focus();
    }
  });
  var mic=el.querySelector('#busMic');
  if(mic)mic.onclick=function(){nat('detenerVoz');busEstado('');nat('iniciarVoz')};
  el.querySelector('#busCerrar').onclick=busCerrar;
  if(B.voz){
    setTimeout(function(){if(S.dlg===d){if(mic)mic.focus();nat('iniciarVoz')}},60);
  }else{
    setTimeout(function(){if(S.dlg===d)inp.focus()},60);
  }
}
window.gtvBuscadorToggle=function(){abrirBuscador()};

}

  actualizarBarra();

  aplicarCacheEstado();

  setInterval(function(){
    if(!document.hidden || enExoNat()) {
    }
  }, 5000);

  document.addEventListener('visibilitychange',function(){if(!document.hidden&&!S.native)sincronizarEstadoCanales()});
}
