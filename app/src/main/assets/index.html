<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GTV Play R</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden;position:fixed;top:0;left:0;right:0;bottom:0;-webkit-user-select:none;user-select:none}
:focus{outline:none}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}

/* BARRA SUPERIOR */
.top-bar{position:fixed;top:0;left:0;right:0;height:56px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;z-index:100;background:#0a0a0a;border-bottom:2px solid #FFD700;pointer-events:none}
.top-bar *{pointer-events:auto}
.top-left{display:flex;align-items:center;gap:10px}
.app-title{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:800;color:#fff;letter-spacing:.5px}
.lic-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase}
.lic-badge.full{background:rgba(0,255,102,.15);color:#00ff66;border:1px solid #00ff66}
.lic-badge.demo{background:rgba(255,215,0,.15);color:#FFD700;border:1px solid #FFD700}
.btn-settings{background:rgba(255,255,255,.1);color:#fff;border:2px solid transparent;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;transition:all .2s}
.btn-settings:focus{border-color:#FFD700;background:rgba(255,215,0,.2);transform:scale(1.05)}

/* LISTA DE CANALES (Diseño Original Chico) */
.view-list{width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:64px 8px 8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(85px,1fr));grid-auto-rows:90px;gap:6px;background:#000}
.card{background:#111;border:2px solid transparent;border-radius:6px;padding:5px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;transition:transform .1s}
.card img{width:100%;height:40px;object-fit:contain;margin-bottom:4px;pointer-events:none}
.card span{font-size:10px;color:#ccc;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;pointer-events:none}
.card:focus{border-color:#FFD700;background:#222;transform:scale(1.05);z-index:2}
.card.off{display:none}
.card.caido{opacity:.35;filter:grayscale(1);cursor:not-allowed}
.card.caido:focus{border-color:#666;background:#1a1a1a;transform:none}

/* ESTADO VACÍO */
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 20px;height:100%;margin-top:-40px}
.empty .icon{font-size:60px;margin-bottom:15px;color:#FFD700}
.empty h2{font-size:20px;color:#fff;margin-bottom:10px}
.empty p{font-size:13px;color:#aaa;margin-bottom:20px;line-height:1.5}
.empty button{background:#FFD700;color:#000;border:2px solid transparent;padding:10px 24px;border-radius:40px;font-weight:700;font-size:14px;transition:all .2s}
.empty button:focus{border-color:#fff;transform:scale(1.05)}

/* REPRODUCTOR */
.view-play{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;display:none;z-index:2000}
.view-play.active{display:block}
.wrapper{position:absolute;top:0;left:0;width:100%;height:100%;background:#000}
.ui{position:absolute;top:0;left:0;right:0;bottom:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .2s}
.ui.show{opacity:1;pointer-events:auto}
.float-btn{position:absolute;right:15px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.7);color:#FFD700;border:2px solid #FFD700;font-size:22px;display:flex;align-items:center;justify-content:center}
.btn-back{bottom:15px;background:#a00;border-color:#fff;color:#fff}
.btn-rot{bottom:70px}
.loader{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);padding:10px 20px;border-radius:30px;border:2px solid #FFD700;color:#FFD700;font-weight:bold;display:none;z-index:30}
.loader.active{display:block}

/* MODAL SETTINGS */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#141414;border:2px solid #FFD700;border-radius:16px;width:100%;max-width:500px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid #333;background:#0a0a0a}
.modal-header h2{font-size:18px;color:#FFD700;display:flex;align-items:center;gap:8px}
.btn-close{background:#222;border:2px solid transparent;color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center}
.btn-close:focus{border-color:#FFD700;background:#333}

.tabs{display:flex;background:#0a0a0a;border-bottom:1px solid #333}
.tab{flex:1;padding:12px;background:none;border:none;border-bottom:3px solid transparent;color:#888;font-size:14px;font-weight:700}
.tab:focus{background:rgba(255,255,255,0.05);color:#fff;outline:none}
.tab.active{color:#FFD700;border-bottom-color:#FFD700}

.modal-body{padding:16px;overflow-y:auto;flex:1}
.tab-content{display:none}
.tab-content.active{display:block}

.section-title{font-size:13px;color:#FFD700;font-weight:700;margin-bottom:10px;text-transform:uppercase}
.input-group{display:flex;gap:8px;margin-bottom:20px}
.input-group input{flex:1;background:#000;border:1px solid #444;color:#fff;padding:10px 12px;border-radius:6px;font-size:14px}
.input-group input:focus{border-color:#FFD700;outline:none}
.btn-primary{background:#FFD700;color:#000;border:none;padding:10px 16px;border-radius:6px;font-size:14px;font-weight:700}
.btn-primary:focus{outline:2px solid #fff}

.listas-grid{display:flex;flex-direction:column;gap:8px}
.lista-item{display:flex;align-items:center;justify-content:space-between;background:#222;padding:12px;border-radius:8px;border:2px solid transparent}
.lista-item:focus{border-color:#FFD700;outline:none}
.lista-item .info h4{font-size:14px;color:#fff;margin-bottom:2px}
.lista-item .info p{font-size:11px;color:#aaa}
.btn-danger{background:rgba(255,50,50,0.2);color:#ff3333;border:1px solid #ff3333;padding:8px 12px;border-radius:6px;font-weight:700;font-size:12px}
.btn-danger:focus{background:#ff3333;color:#fff;outline:none}

.lic-box{background:#0a0a0a;border:1px solid #333;border-radius:12px;padding:16px;text-align:center}
.lic-box h3{font-size:15px;color:#fff;margin-bottom:8px}
.lic-id{background:#000;padding:12px;border-radius:8px;font-family:monospace;font-size:16px;color:#FFD700;border:1px solid #444;margin-bottom:12px;word-break:break-all}
.lic-status{font-size:14px;font-weight:700;margin-bottom:12px}
.btn-wa{background:#25D366;color:#fff;border:none;padding:10px;border-radius:40px;font-size:14px;font-weight:700;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-wa:focus{outline:2px solid #fff}
</style>
</head>
<body>

<div class="top-bar" id="topBar">
  <div class="top-left">
    <span class="app-title">GTV PLAY R</span>
    <span class="lic-badge demo" id="topLicBadge">DEMO</span>
  </div>
  <button class="btn-settings" id="btnOpenSettings" tabindex="0">⚙️ Menú</button>
</div>

<div id="list" class="view-list"></div>

<div id="player" class="view-play">
  <div class="wrapper" id="wrap">
    <iframe id="ifr" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    <iframe id="kickIfr" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    <iframe id="okIfr" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    <div class="ui" id="ui">
      <div class="loader" id="ld">Sintonizando...</div>
      <button class="float-btn btn-back" id="goBack" tabindex="0">✕</button>
      <button class="float-btn btn-rot" id="goRot" tabindex="0">⟳</button>
    </div>
  </div>
</div>

<div id="settingsModal" class="modal-overlay hidden">
  <div class="modal-box" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2><span>⚙️</span> Configuración</h2>
      <button class="btn-close" id="btnCloseSettings" tabindex="0">✕</button>
    </div>
    
    <div class="tabs">
      <button class="tab active" data-tab="tab-listas" tabindex="0">📺 Mis Listas</button>
      <button class="tab" data-tab="tab-licencia" tabindex="0">🎫 Mi Licencia</button>
    </div>

    <div class="modal-body">
      <div id="tab-listas" class="tab-content active">
        <div class="section-title">Agregar Lista</div>
        <div class="input-group">
          <input type="text" id="inputNuevaLista" placeholder="Ingresá la URL de la lista..." autocomplete="off" spellcheck="false" tabindex="0">
          <button class="btn-primary" id="btnCargarLista" tabindex="0">Cargar</button>
        </div>

        <div class="section-title" style="margin-top:20px;">Listas Guardadas</div>
        <div class="listas-grid" id="listasGrid"></div>
      </div>

      <div id="tab-licencia" class="tab-content">
        <div class="lic-box">
          <h3>Tu ID de Dispositivo</h3>
          <div class="lic-id" id="licDeviceId">Cargando...</div>
          <div class="lic-status" id="licStatusText">...</div>
          <button class="btn-wa" id="btnWa" tabindex="0">💬 Contactar por WhatsApp</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

var SELLO = 'gtv_app_2026_secreto_xyz789';
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var ls = {
  get: function(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},
  set: function(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  getJ: function(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v||d}catch(e){return d}},
  setJ: function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
function ap(){return window.AndroidPlayer||null}
function hasNat(n){var a=ap();return !!(a&&a[n])}
function nat(n){var a=ap();if(!a||!a[n])return undefined;try{return a[n].apply(a,Array.prototype.slice.call(arguments,1))}catch(e){return undefined}}

var S = { list: [], index: 0, view: 'list', caidos: {}, ocultos: {} };
var lic = { hasLicense: false, expirationDate: null, demoStart: null };
var remote = { horasDemo: 24, whatsapp: '5491133550182' };
var deviceId = '';
if(hasNat('getDeviceId')){try{deviceId=nat('getDeviceId')}catch(e){}}
if(!deviceId){ deviceId = ls.get('gtv_device_id','GTV-R-XXXXXX'); ls.set('gtv_device_id',deviceId); }

function renderLista(){
  var D = $('list');
  if(!S.list.length){
    D.innerHTML = '<div class="empty"><div class="icon">📺</div><h2>Bienvenido a GTV Play R</h2><p>No tenés canales cargados.<br>Abrí el menú de configuración para agregar tu lista.</p><button id="btnEmptyConfig" tabindex="0">Abrir Menú</button></div>';
    $('btnEmptyConfig').onclick = abrirSettings;
    return;
  }
  var h = '';
  for(var i=0;i<S.list.length;i++){
    var c = S.list[i];
    var cls = 'card';
    if(S.ocultos[c.url]) cls += ' off';
    else if(S.caidos[c.url]) cls += ' caido';
    h += '<div class="'+cls+'" tabindex="0" data-i="'+i+'"><img src="'+(c.logo||'')+'"><span>'+esc(c.nombre||c.name)+'</span></div>';
  }
  D.innerHTML = h;
  var cards = D.querySelectorAll('.card');
  cards.forEach(function(card){
    card.addEventListener('click', function(){ play(parseInt(this.dataset.i), 'user'); });
  });
}

function abrirSettings(){
  $('settingsModal').classList.remove('hidden');
  $('btnCloseSettings').focus();
  actualizarLicenciaUI();
  cargarListasGuardadas();
}
function cerrarSettings(){
  $('settingsModal').classList.add('hidden');
  $('btnOpenSettings').focus();
}

$('btnOpenSettings').onclick = abrirSettings;
$('btnCloseSettings').onclick = cerrarSettings;

var tabs = document.querySelectorAll('.tab');
tabs.forEach(function(tab){
  tab.addEventListener('click', function(){
    tabs.forEach(function(t){ t.classList.remove('active'); });
    document.querySelectorAll('.tab-content').forEach(function(c){ c.classList.remove('active'); });
    this.classList.add('active');
    document.getElementById(this.dataset.tab).classList.add('active');
  });
});

function cargarListasGuardadas(){
  var grid = $('listasGrid');
  grid.innerHTML = '<div style="color:#aaa;text-align:center;">Cargando...</div>';
  var json = '[]';
  if(hasNat('listarListas')) { try{ json = nat('listarListas'); }catch(e){} }
  var listas = JSON.parse(json);
  
  if(!listas.length){
    grid.innerHTML = '<div style="color:#aaa;text-align:center;">No hay listas guardadas aún.</div>';
    return;
  }
  
  var h = '';
  listas.forEach(function(l){
    h += '<div class="lista-item" tabindex="0">' +
           '<div class="info"><h4>'+esc(l.nombre)+'</h4><p>'+l.canales+' canales</p></div>' +
           '<div>' +
             '<button class="btn-primary" onclick="usarLista(\''+esc(l.nombre)+'\')" style="padding:8px 16px;">Usar</button>' +
             '<button class="btn-danger" onclick="borrarLista(\''+esc(l.nombre)+'\')">🗑</button>' +
           '</div>' +
         '</div>';
  });
  grid.innerHTML = h;
}

window.usarLista = function(nombre){
  if(hasNat('usarLista')) nat('usarLista', nombre);
  cerrarSettings();
};
window.borrarLista = function(nombre){
  if(confirm('¿Eliminar la lista "'+nombre+'"?')){
    if(hasNat('eliminarLista')) nat('eliminarLista', nombre);
    setTimeout(cargarListasGuardadas, 200);
  }
};

$('btnCargarLista').onclick = function(){
  var txt = $('inputNuevaLista').value.trim();
  if(!txt) return;
  
  // Llama directo al nativo sin abrir el cartel feo de Java
  if(hasNat('cargarListaDesdeHtml')) {
      nat('cargarListaDesdeHtml', txt);
      cerrarSettings();
  } else {
      if(hasNat('abrirDialogo')) nat('abrirDialogo'); 
  }
};

function actualizarLicenciaUI(){
  var hoy = new Date().toISOString().split('T')[0];
  var activa = false;
  var txt = '';
  var color = '#ff3333';
  
  if(lic.expirationDate && lic.expirationDate >= hoy){
    activa = true;
    txt = '✅ FULL activa (Vence: '+lic.expirationDate+')';
    color = '#00ff66';
  } else if(lic.demoStart && (Date.now() - lic.demoStart < remote.horasDemo * 3600000)){
    activa = true;
    txt = '🎁 Modo DEMO activo';
    color = '#FFD700';
  } else {
    txt = '⚠️ Demo expirada o sin licencia';
  }
  
  $('licDeviceId').textContent = deviceId;
  $('licStatusText').textContent = txt;
  $('licStatusText').style.color = color;
  
  var badge = $('topLicBadge');
  if(lic.expirationDate) {
      badge.textContent = 'FULL';
      badge.className = 'lic-badge full';
  } else {
      badge.textContent = 'DEMO';
      badge.className = 'lic-badge demo';
  }
}

$('btnWa').onclick = function(){
  window.open('https://wa.me/'+remote.whatsapp+'?text='+encodeURIComponent('Hola, necesito activar mi licencia GTV Play R. Mi ID es: '+deviceId), '_blank');
};

function play(i, origin){
  if(i < 0 || i >= S.list.length) return;
  var c = S.list[i];
  if(S.caidos[c.url]) return;
  
  S.index = i;
  nat('sincronizarIndice', i);
  ls.set('gtv_last_index', String(i));
  
  $('player').classList.add('active');
  $('list').classList.add('hidden');
  nat('reproducirCanal', i);
}

function detener(){
  $('player').classList.remove('active');
  $('list').classList.remove('hidden');
  // Llama al nativo para que apague el player correctamente y vuelva a mostrar el WebView
  if(hasNat('mostrarWebView')) nat('mostrarWebView');
}
$('goBack').onclick = detener;

// Manejo de botón "Atrás" físico (Control Remoto)
document.addEventListener('keydown', function(e){
  var isBack = (e.keyCode === 4 || e.keyCode === 8 || e.key === 'Escape' || e.key === 'Backspace');
  if(isBack) {
    if(!$('settingsModal').classList.contains('hidden')) {
      cerrarSettings(); 
      e.preventDefault(); 
      return; 
    }
    if($('player').classList.contains('active')) {
      detener(); 
      e.preventDefault(); 
      return;
    }
  }
});

window.gtvSetCanales = function(json){
  try {
    var arr = JSON.parse(json);
    S.list = arr;
    renderLista();
  } catch(e) {}
};

var cached = ls.getJ('gtv_channels', null);
if(cached) S.list = cached;
renderLista();

lic.expirationDate = "2026-12-31";
actualizarLicenciaUI();

})();
</script>
</body>
</html>
