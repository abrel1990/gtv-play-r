<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GTVPlay</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;background:#060911;overflow:hidden;font-family:'Inter',sans-serif;color:#f8fafc}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .4s ease,transform .4s ease}
#splash.fade-out{opacity:0;transform:scale(1.05);pointer-events:none}
.logo{font-family:'Orbitron',sans-serif;font-size:clamp(42px,9vw,72px);font-weight:900;letter-spacing:.02em;animation:logoIn .6s cubic-bezier(.16,1,.3,1) both}
.logo .gtv{color:#00f3ff;text-shadow:0 0 24px rgba(0,243,255,.65)}
.logo .play{color:#bc13fe;text-shadow:0 0 24px rgba(188,19,254,.65)}
@keyframes logoIn{0%{opacity:0;transform:translateY(14px) scale(.94)}100%{opacity:1;transform:translateY(0) scale(1)}}
.ring{width:54px;height:54px;border-radius:50%;border:3px solid rgba(0,243,255,.15);border-top-color:#00f3ff;border-right-color:#bc13fe;animation:spin 1.4s linear infinite;box-shadow:0 0 24px rgba(0,243,255,.25)}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:rgba(148,163,184,.85);animation:fadeIn .8s ease .3s both}
.loading .dots::after{content:'';animation:dots 1.6s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}100%{content:''}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.signature{position:absolute;bottom:32px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(100,116,139,.9);animation:fadeIn 1s ease .6s both}
.signature .author{color:#00f3ff;font-weight:600;text-shadow:0 0 10px rgba(0,243,255,.5)}
</style>
</head>
<body>
<div id="splash">
  <div class="logo"><span class="gtv">GTV</span><span class="play">Play</span></div>
  <div class="ring"></div>
  <div class="loading">Cargando<span class="dots"></span></div>
</div>
<div class="signature">creado por <span class="author">Gabitosila</span></div>
<script>
(function(){
  var MIN_MS = 2500;
  var MAX_MS = 8000;
  var t0 = Date.now();
  var splashTerminado = false;

  // Android llama a esta función cuando la lista maestra está lista
  window.gtvSplashListaLista = function(){
    if(splashTerminado) return;
    var transcurrido = Date.now() - t0;
    var restante = Math.max(0, MIN_MS - transcurrido);
    setTimeout(ocultarSplash, restante);
  };

  // Timeout máximo: si no llega la lista en 8s, ocultamos igual
  setTimeout(function(){
    if(!splashTerminado) ocultarSplash();
  }, MAX_MS);

  function ocultarSplash(){
    if(splashTerminado) return;
    splashTerminado = true;
    var s = document.getElementById('splash');
    if(s) s.classList.add('fade-out');
    setTimeout(function(){
      try {
        if(window.AndroidSplash && window.AndroidSplash.onSplashTerminado){
          window.AndroidSplash.onSplashTerminado();
        }
      } catch(e){}
    }, 420);
  }
})();
</script>
</body>
</html>
